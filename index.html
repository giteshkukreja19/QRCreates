<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRCreate — Beautiful QR Codes & Barcodes</title>
    <meta name="description" content="A simple, fast, and private studio to design customized QR codes and barcodes right on your computer.">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="QRCreate">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css?v=2.4">
</head>
<body>
    <div class="app-layout">
        <!-- Top Navigation -->
        <header class="navbar">
            <div class="brand">
                <div class="brand-logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7" rx="2"></rect>
                        <rect x="14" y="3" width="7" height="7" rx="2"></rect>
                        <rect x="14" y="14" width="7" height="7" rx="2"></rect>
                        <rect x="3" y="14" width="7" height="7" rx="2"></rect>
                        <circle cx="6.5" cy="6.5" r="1.2" fill="currentColor"></circle>
                        <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"></circle>
                        <circle cx="17.5" cy="17.5" r="1.2" fill="currentColor"></circle>
                        <circle cx="6.5" cy="17.5" r="1.2" fill="currentColor"></circle>
                    </svg>
                </div>
                <div class="brand-info">
                    <div class="brand-title-wrap">
                        <span class="brand-name">QRCreate</span>
                        <span class="privacy-pill">Private & Offline</span>
                    </div>
                    <span class="brand-desc">Design custom QR codes & barcodes locally</span>
                </div>
            </div>

            <div class="nav-actions">
                <button id="pwaInstallBtn" class="btn-subtle pwa-install-btn" title="Install QRCreate on your device" type="button" hidden>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <span>Install App</span>
                </button>
                <button id="scannerBtn" class="btn-subtle" title="Scan or decode a code" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0-4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
                    <span>Scan code</span>
                </button>
                <button id="historyBtn" class="btn-subtle" title="View previously created codes" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <span>Recent</span>
                    <span id="historyCountBadge" class="count-pill" hidden>0</span>
                </button>
                <button id="themeToggleBtn" class="btn-icon" title="Toggle theme" aria-label="Toggle theme" type="button">
                    <svg id="themeIconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" hidden><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg id="themeIconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="studio-grid" id="studioGrid">
            <!-- Left Panel: Controls & Options -->
            <section class="controls-panel" id="controlsPanel">
                <!-- Mobile Live Mini Bar -->
                <div class="mobile-live-bar" id="mobileLiveBar">
                    <div class="mobile-live-left">
                        <div class="mobile-live-thumb-box">
                            <img id="mobileThumbImg" alt="Mini code preview" class="mobile-live-thumb">
                        </div>
                        <div class="mobile-live-info">
                            <span class="mobile-live-title" id="mobileLiveTitle">Live Preview Ready</span>
                            <span class="mobile-live-tag" id="mobileLiveTag">■ Classic • Solid</span>
                        </div>
                    </div>
                    <button id="mobileViewPreviewBtn" class="mobile-live-cta" type="button">
                        <span>Preview</span>
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </button>
                </div>
                <!-- Mode Switcher: QR Code vs Barcode -->
                <div class="card card-compact">
                    <div class="segmented-control">
                        <button class="segment-tab active" data-engine="qr" type="button">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg>
                            <span>QR Code</span>
                        </button>
                        <button class="segment-tab" data-engine="barcode" type="button">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5v14M6 5v14M8 5v14M11 5v14M14 5v14M17 5v14M20 5v14M22 5v14"/></svg>
                            <span>1D Barcode</span>
                        </button>
                    </div>
                </div>

                <!-- QR Content Category Tabs -->
                <div id="qrCategoryContainer" class="card">
                    <div class="card-header">
                        <h2 class="card-title">What would you like to link?</h2>
                    </div>

                    <div class="content-type-chips">
                        <button class="type-chip active" data-type="url" type="button">🔗 Website</button>
                        <button class="type-chip" data-type="text" type="button">📝 Note / Text</button>
                        <button class="type-chip" data-type="wifi" type="button">📶 Wi-Fi</button>
                        <button class="type-chip" data-type="vcard" type="button">👤 Contact</button>
                        <button class="type-chip" data-type="upi" type="button">💳 UPI Pay</button>
                        <button class="type-chip" data-type="email" type="button">✉️ Email</button>
                        <button class="type-chip" data-type="sms" type="button">💬 SMS</button>
                        <button class="type-chip" data-type="phone" type="button">📞 Phone</button>
                        <button class="type-chip" data-type="geo" type="button">📍 Location</button>
                        <button class="type-chip" data-type="event" type="button">📅 Event</button>
                        <button class="type-chip" data-type="crypto" type="button">₿ Crypto</button>
                    </div>

                    <!-- Dynamic Input Panels -->
                    <div class="input-panels">
                        <!-- URL Panel -->
                        <div class="input-panel active" id="panel-url">
                            <label for="urlInput">Destination URL</label>
                            <div class="input-row">
                                <input type="url" id="urlInput" placeholder="https://example.com" value="https://example.com">
                                <button id="testUrlBtn" class="btn-secondary btn-sm" type="button">Test link</button>
                            </div>
                        </div>

                        <!-- Plain Text Panel -->
                        <div class="input-panel" id="panel-text">
                            <label for="textInput">Text or note</label>
                            <textarea id="textInput" rows="3" placeholder="Type or paste message, notes, or raw text..."></textarea>
                        </div>

                        <!-- Wi-Fi Panel -->
                        <div class="input-panel" id="panel-wifi">
                            <div class="grid-2">
                                <div class="field">
                                    <label for="wifiSsid">Network name (SSID)</label>
                                    <input type="text" id="wifiSsid" placeholder="e.g. Home_Guest_5G">
                                </div>
                                <div class="field">
                                    <label for="wifiAuth">Security</label>
                                    <select id="wifiAuth">
                                        <option value="WPA">WPA / WPA2 / WPA3</option>
                                        <option value="WEP">WEP</option>
                                        <option value="nopass">None (Open)</option>
                                    </select>
                                </div>
                            </div>
                            <div class="field" id="wifiPasswordGroup">
                                <label for="wifiPassword">Password</label>
                                <input type="text" id="wifiPassword" placeholder="Enter Wi-Fi password">
                            </div>
                            <label class="checkbox-field">
                                <input type="checkbox" id="wifiHidden">
                                <span>Hidden network</span>
                            </label>
                        </div>

                        <!-- vCard Contact Panel -->
                        <div class="input-panel" id="panel-vcard">
                            <div class="grid-2">
                                <div class="field">
                                    <label for="vcardFirst">First name</label>
                                    <input type="text" id="vcardFirst" placeholder="">
                                </div>
                                <div class="field">
                                    <label for="vcardLast">Last name</label>
                                    <input type="text" id="vcardLast" placeholder="">
                                </div>
                            </div>
                            <div class="grid-2">
                                <div class="field">
                                    <label for="vcardPhone">Phone number</label>
                                    <input type="tel" id="vcardPhone" placeholder="+1 (555) 019-2834">
                                </div>
                                <div class="field">
                                    <label for="vcardEmail">Email</label>
                                    <input type="email" id="vcardEmail" placeholder="contact@example.com">
                                </div>
                            </div>
                            <div class="grid-2">
                                <div class="field">
                                    <label for="vcardOrg">Company / Team</label>
                                    <input type="text" id="vcardOrg" placeholder="Acme Studio">
                                </div>
                                <div class="field">
                                    <label for="vcardTitle">Title</label>
                                    <input type="text" id="vcardTitle" placeholder="Designer / Engineer">
                                </div>
                            </div>
                            <div class="field">
                                <label for="vcardUrl">Website</label>
                                <input type="url" id="vcardUrl" placeholder="https://example.com">
                            </div>
                        </div>

                        <!-- UPI Panel -->
                        <div class="input-panel" id="panel-upi">
                            <div class="grid-2">
                                <div class="field">
                                    <label for="upiVpa">UPI ID (VPA)</label>
                                    <input type="text" id="upiVpa" placeholder="username@upi or merchant@okaxis">
                                </div>
                                <div class="field">
                                    <label for="upiName">Payee name</label>
                                    <input type="text" id="upiName" placeholder="">
                                </div>
                            </div>
                            <div class="grid-2">
                                <div class="field">
                                    <label for="upiAmount">Amount (₹ INR, optional)</label>
                                    <input type="number" id="upiAmount" placeholder="e.g. 500" min="0">
                                </div>
                                <div class="field">
                                    <label for="upiNote">Note (optional)</label>
                                    <input type="text" id="upiNote" placeholder="e.g. Coffee or Services">
                                </div>
                            </div>
                        </div>

                        <!-- Email Panel -->
                        <div class="input-panel" id="panel-email">
                            <div class="field">
                                <label for="emailTo">Send to</label>
                                <input type="email" id="emailTo" placeholder="team@company.com">
                            </div>
                            <div class="field">
                                <label for="emailSubject">Subject</label>
                                <input type="text" id="emailSubject" placeholder="Hello from QRCreate">
                            </div>
                            <div class="field">
                                <label for="emailBody">Message</label>
                                <textarea id="emailBody" rows="2" placeholder="Hi there..."></textarea>
                            </div>
                        </div>

                        <!-- SMS Panel -->
                        <div class="input-panel" id="panel-sms">
                            <div class="field">
                                <label for="smsPhone">Phone number</label>
                                <input type="tel" id="smsPhone" placeholder="+1234567890">
                            </div>
                            <div class="field">
                                <label for="smsMessage">Pre-filled text</label>
                                <textarea id="smsMessage" rows="2" placeholder="Hey, checking out your product..."></textarea>
                            </div>
                        </div>

                        <!-- Phone Panel -->
                        <div class="input-panel" id="panel-phone">
                            <div class="field">
                                <label for="phoneInput">Phone number</label>
                                <input type="tel" id="phoneInput" placeholder="+1 (555) 012-3456">
                            </div>
                        </div>

                        <!-- Geo Panel -->
                        <div class="input-panel" id="panel-geo">
                            <div class="grid-2">
                                <div class="field">
                                    <label for="geoLat">Latitude</label>
                                    <input type="number" id="geoLat" placeholder="37.7749" step="any">
                                </div>
                                <div class="field">
                                    <label for="geoLng">Longitude</label>
                                    <input type="number" id="geoLng" placeholder="-122.4194" step="any">
                                </div>
                            </div>
                        </div>

                        <!-- Event Panel -->
                        <div class="input-panel" id="panel-event">
                            <div class="field">
                                <label for="eventTitle">Event title</label>
                                <input type="text" id="eventTitle" placeholder="Launch Meetup">
                            </div>
                            <div class="grid-2">
                                <div class="field">
                                    <label for="eventStart">Start time</label>
                                    <input type="datetime-local" id="eventStart">
                                </div>
                                <div class="field">
                                    <label for="eventEnd">End time</label>
                                    <input type="datetime-local" id="eventEnd">
                                </div>
                            </div>
                            <div class="field">
                                <label for="eventLocation">Location</label>
                                <input type="text" id="eventLocation" placeholder="Main Hall or Zoom link">
                            </div>
                        </div>

                        <!-- Crypto Panel -->
                        <div class="input-panel" id="panel-crypto">
                            <div class="grid-2">
                                <div class="field">
                                    <label for="cryptoCurrency">Coin</label>
                                    <select id="cryptoCurrency">
                                        <option value="bitcoin">Bitcoin (BTC)</option>
                                        <option value="ethereum">Ethereum (ETH)</option>
                                        <option value="solana">Solana (SOL)</option>
                                        <option value="usdt">Tether (USDT)</option>
                                    </select>
                                </div>
                                <div class="field">
                                    <label for="cryptoAmount">Amount (optional)</label>
                                    <input type="number" id="cryptoAmount" placeholder="0.05" step="any">
                                </div>
                            </div>
                            <div class="field">
                                <label for="cryptoAddress">Wallet address</label>
                                <input type="text" id="cryptoAddress" placeholder="Paste wallet address">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Barcode Panel (Shown in Barcode mode) -->
                <div id="barcodeCategoryContainer" class="card" hidden>
                    <div class="card-header">
                        <h2 class="card-title">Barcode settings</h2>
                    </div>

                    <div class="grid-2">
                        <div class="field">
                            <label for="barcodeStandard">Standard</label>
                            <select id="barcodeStandard">
                                <option value="code128">Code 128 (Universal Text & Digits)</option>
                                <option value="code39">Code 39 (Logistics)</option>
                                <option value="ean13">EAN-13 (Standard Retail 12-13 Digits)</option>
                                <option value="ean8">EAN-8 (Compact Retail)</option>
                                <option value="upca">UPC-A (North American Retail)</option>
                                <option value="isbn13">ISBN-13 (Books & Print)</option>
                                <option value="itf">ITF-14 (Packaging)</option>
                                <option value="codabar">Codabar (Libraries)</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="barcodeTextInput">Barcode value</label>
                            <input type="text" id="barcodeTextInput" value="QRCREATE-9921" placeholder="e.g. 1234567890">
                        </div>
                    </div>
                    <label class="checkbox-field">
                        <input type="checkbox" id="barcodeShowText" checked>
                        <span>Show text number below bars</span>
                    </label>
                </div>

                <!-- Pattern & Style Section -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Shape & Pattern</h2>
                        <span class="card-subtitle">Choose the look of your code</span>
                    </div>

                    <div id="qrPatternSelector" class="pattern-grid">
                        <button class="pattern-card active" data-drawer="square" type="button">
                            <div class="pattern-preview pattern-square">
                                <span></span><span></span><span></span><span></span>
                            </div>
                            <span class="pattern-name">Classic</span>
                            <span class="pattern-sub">Standard sharp</span>
                        </button>

                        <button class="pattern-card" data-drawer="dots" type="button">
                            <div class="pattern-preview pattern-dots">
                                <span></span><span></span><span></span><span></span>
                            </div>
                            <span class="pattern-name">Dots</span>
                            <span class="pattern-sub">Circle matrix</span>
                        </button>

                        <button class="pattern-card" data-drawer="dashes" type="button">
                            <div class="pattern-preview pattern-dashes">
                                <span></span><span></span><span></span>
                            </div>
                            <span class="pattern-name">Dashes</span>
                            <span class="pattern-sub">Horizontal bars</span>
                        </button>

                        <button class="pattern-card" data-drawer="vertical" type="button">
                            <div class="pattern-preview pattern-vertical">
                                <span></span><span></span><span></span>
                            </div>
                            <span class="pattern-name">Stripes</span>
                            <span class="pattern-sub">Vertical lines</span>
                        </button>

                        <button class="pattern-card" data-drawer="rounded" type="button">
                            <div class="pattern-preview pattern-rounded">
                                <span></span><span></span><span></span><span></span>
                            </div>
                            <span class="pattern-name">Rounded</span>
                            <span class="pattern-sub">Smooth corners</span>
                        </button>

                        <button class="pattern-card" data-drawer="gapped" type="button">
                            <div class="pattern-preview pattern-gapped">
                                <span></span><span></span><span></span><span></span>
                            </div>
                            <span class="pattern-name">Gapped</span>
                            <span class="pattern-sub">Spaced tiles</span>
                        </button>
                    </div>

                    <div id="barcodeDensitySelector" class="field mt-3" hidden>
                        <div class="slider-label-row">
                            <label for="barHeightSlider">Bar height</label>
                            <span id="barHeightVal" class="slider-val">16 mm</span>
                        </div>
                        <input type="range" id="barHeightSlider" min="8" max="28" value="16" step="1">
                    </div>
                </div>

                <!-- Colors & Palette Section -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Colors</h2>
                        <span class="card-subtitle">Pick a curated scheme or custom shade</span>
                    </div>

                    <!-- Preset Palette Chips -->
                    <div class="palette-chips">
